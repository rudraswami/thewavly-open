name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s sdk/python/tests -v
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
      - run: cd sdk/go && go test ./...
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: cd sdk/java && javac -d /tmp/j src/main/java/io/github/rudraswami/thewavly/Wavly.java src/test/java/io/github/rudraswami/thewavly/WavlyTest.java && java -cp /tmp/j io.github.rudraswami.thewavly.WavlyTest
